name: Wheel size matrix

on:
  push:
    branches: [chore/wheel-matrix]

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.platform.name }} / CPython ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build manylinux2014 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: "2014"
          rust-toolchain: "1.98"
          maturin-version: v1.14.1
          args: >-
            --release --locked --out dist --manifest-path python/Cargo.toml
            -i python${{ matrix.python }}
      - name: Measure wheel
        run: >-
          python3 tools/report_wheel_size.py dist
          --platform ${{ matrix.platform.name }}
          --python ${{ matrix.python }}
          --output dist/size-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-${{ matrix.platform.name }}-py${{ matrix.python }}
          path: dist/
          retention-days: 1

  native:
    name: ${{ matrix.platform.name }} / CPython ${{ matrix.python }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: "1.98"
          maturin-version: v1.14.1
          args: >-
            --release --locked --out dist --manifest-path python/Cargo.toml
            -i python
      - name: Measure wheel
        run: >-
          python tools/report_wheel_size.py dist
          --platform ${{ matrix.platform.name }}
          --python ${{ matrix.python }}
          --output dist/size-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-${{ matrix.platform.name }}-py${{ matrix.python }}
          path: dist/
          retention-days: 1
