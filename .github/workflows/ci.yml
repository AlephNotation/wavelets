name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets --all-features

  quality:
    name: Formatting, lints, docs, and generated sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path benchmarks/Cargo.toml --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 -m pip install --disable-pip-version-check -r tools/requirements-coefficients.txt -r tools/requirements-reference.txt
      - run: python3 tools/generate_builtin_coefficients.py --check
      - run: python3 tools/generate_pywavelets_fixtures.py --check
      - run: python3 tools/generate_fuzz_seeds.py --check

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - run: cargo check --lib

  aarch64:
    name: Check aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: cargo check --lib --target aarch64-unknown-linux-gnu
      - run: cargo check --manifest-path benchmarks/Cargo.toml --bin wavelets-compare-runner --target aarch64-unknown-linux-gnu

  benchmarks:
    name: Check benchmark tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: cargo clippy --manifest-path benchmarks/Cargo.toml --all-targets --all-features -- -D warnings
      - run: sudo apt-get update
      - run: sudo apt-get install --yes libgsl-dev
      - run: python3 -m pip install --disable-pip-version-check -r benchmarks/requirements-dev.txt
      - run: ruff check benchmarks/compare
      - run: ruff format --check benchmarks/compare
      - run: python3 -m py_compile benchmarks/compare/compare.py benchmarks/compare/pywavelets_runner.py
      - name: Smoke-test cross-library comparison
        run: >-
          python3 benchmarks/compare/compare.py
          --samples 3
          --sample-ms 1
          --warmup-batches 1
          --filter multilevel/forward/f64/db1/periodization/1024
          --gsl
          --output /tmp/wavelets-comparison-smoke.json
