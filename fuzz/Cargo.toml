[package]
name = "wavelets-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
wavelets = { path = ".." }

[lib]
name = "wavelets_fuzz"
path = "src/lib.rs"

[[bin]]
name = "dwt_roundtrip"
path = "fuzz_targets/dwt_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wavedec_roundtrip"
path = "fuzz_targets/wavedec_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "custom_filter_bank"
path = "fuzz_targets/custom_filter_bank.rs"
test = false
doc = false
bench = false
