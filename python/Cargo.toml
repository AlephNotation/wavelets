[package]
name = "wavelets-python"
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.98"
publish = false

[features]
default = []
experimental-kernels = ["wavelets/experimental-kernels"]

[lib]
name = "_wavelets_rs"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29.0"
pyo3 = { version = "0.29.2", features = ["extension-module"] }
wavelets = { path = ".." }

[lints.rust]
unsafe_code = "deny"
