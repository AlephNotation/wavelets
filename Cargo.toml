[package]
name = "wavelets"
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.98"
description = "Plan-once, allocation-free discrete wavelet transforms"
license = "MIT"
readme = "README.md"
repository = "https://github.com/AlephNotation/wavelets"
documentation = "https://docs.rs/wavelets"
keywords = ["wavelet", "dwt", "signal-processing", "dsp"]
categories = ["algorithms", "mathematics", "science"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/MIGRATING_FROM_PYWAVELETS.md",
]

[features]
count-allocations = ["dep:allocation-counter"]

[dependencies]
allocation-counter = { version = "0.8.1", optional = true }
fearless_simd = "0.7.0"

[dev-dependencies]
proptest = "1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
